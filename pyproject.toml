[project]
name = "merck-ds-demo"
version = "0.1.0"
description = "Outside-in market research demo: Merck DS position in EMEA Academia (unofficial)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "duckdb",
    "httpx",
    "pandas",
    "plotly",
    "pydantic",
    "pypdf>=7.1.1",
    "python-dotenv",
    "pyyaml",
    "reportlab>=5.1.0",
    "streamlit",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
