# Avantor – 6-step restatement to DS-comparable EMEA Academia revenue (see CLAUDE.md "Peer restatement").
# Facts are referenced by (period, region, segment) as stored by src/connectors/edgar.py; numbers in USD_m.
# Avantor re-segmented in 2025 (Laboratory Solutions / Bioscience Production); its last geographic segments
# (Americas / Europe / AMEA) are in the FY2023 10-K, so the Europe share comes from FY2023.

peer: avantor
label: Avantor
period: FY2025
currency: USD
tenk_url: https://www.sec.gov/Archives/edgar/data/1722482/000162828026007118/avtr-20251231.htm

# Step 1 – total revenue (A)
revenue: {period: FY2025}

# Step 2 – Europe share from FY2023 geographic segments (A for FY2023), mix factor for drift to FY2025
geo:
  numerator: {period: FY2023, segment: "consolidation=ReportableGeographicalComponents;segment=EuropeSegment"}
  denominator: {period: FY2023}
  mix_factor:
    {key: geo_mix_factor, low: 0.93, base: 1.0, high: 1.05, grade: C,
     source: "estimate: FY2023 Europe share applied to FY2025; non-US share moved little (see show output)",
     note: "Avantor 'Europe' segment; AMEA (incl. Middle East/Africa) excluded."}

# Step 3 – business scope
scope:
  include:
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=LaboratorySolutionsSegment"}
      weight: {key: w_laboratory_solutions, low: 1, base: 1, high: 1, grade: A, source: "in scope: VWR channel + lab chemicals"}
      evidence: "in our channel business, VWR, we distribute consumables and equipment to laboratories around the world"
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=BioscienceProductionSegment"}
      weight: {key: w_bioscience_production, low: 0, base: 0, high: 0.05, grade: C,
               source: "bioprocess excluded per CLAUDE.md; high case keeps some high-purity lab chemicals"}
  deduct: []

# Step 4 – DS-equivalent product share of Laboratory Solutions (excl. equipment, instruments, services, PPE)
# FY2023 company mix (disclosed): materials & consumables 37% + 36% = 73%, services 14%, equipment 13%.
# Bioscience Production (32% of sales) is almost all materials & consumables, so Lab Solutions' M&C share is
# about (73 - 32) / 68 = 60%; DS-relevant part of that M&C (excl. PPE, cleanroom, apparel) 80-95%.
ds_share:
  {key: ds_share, low: 0.48, base: 0.53, high: 0.60, grade: C,
   source: "derived from disclosed FY2023 product mix (Avantor 2023 Annual Report p.20) x estimated DS-relevant share of M&C",
   quote: "Proprietary materials & consumables 37% Third-party materials & consumables 36% Services & specialty procurement 14% Equipment & instrumentation 13%",
   quote_value: 37, source_file: data/raw/peers/us_avantor_2023_annual-report.pdf, page: 20}

# Step 4b – resold Merck/Sigma-Aldrich share of DS-equivalent revenue
merck_resale_share:
  {key: merck_resale_share, low: 0.06, base: 0.10, high: 0.15, grade: C,
   source: "estimate: VWR carries third-party brands incl. Merck/Sigma-Aldrich",
   evidence: "millions of SKUs from the most renowned life sciences suppliers in the world"}

# Step 5 – Academia share (Merck counts hospitals as Academia) =
#   disclosed Europe E&G share x concentration in Lab Solutions x drift FY2023->FY2025 + hospital add-on
academia:
  eg_share:
    {key: eg_share_europe, low: 0.10, base: 0.10, high: 0.10, grade: A, unit: share,
     source: "Avantor 2023 Annual Report p.51: Europe organic net sales by end market, FY2023 (Europe-specific)",
     quote: "Education & government (10%) — Sales declined low single-digits driven by COVID-19 related headwinds in the government end market",
     quote_value: 10, source_file: data/raw/peers/us_avantor_2023_annual-report.pdf, page: 51}
  concentration:
    {key: eg_concentration_lab_solutions, low: 1.3, base: 1.45, high: 1.5, grade: C,
     source: "E&G is served by Laboratory Solutions (68% of FY2024 sales); if all E&G sits there, share x 1/0.68 = 1.47",
     quote: "Laboratory Solutions 68% Bioscience Production 32%", quote_value: 68,
     source_file: data/raw/peers/us_avantor_2024_annual-report.pdf, page: 20}
  emea_factor:
    {key: eg_drift_2023_2025, low: 0.8, base: 0.9, high: 1.0, grade: C,
     source: "company E&G share fell from 13% (FY2023) to 11% (FY2024), factor 0.85; Q1 2025 release cites E&G headwinds",
     quote: "Customer group Biopharma & healthcare 63% Education & government 11%", quote_value: 11,
     source_file: data/raw/peers/us_avantor_2024_annual-report.pdf, page: 20}
  hospital_addon:
    {key: hospital_addon, low: 0.04, base: 0.07, high: 0.10, grade: C, unit: share points,
     source: "Europe Healthcare end market 10% of FY2023 Europe sales (disclosed) x 30-70% hospital/clinical labs, concentrated in Lab Solutions",
     quote: "Healthcare (10%) — Sales declined double-digits primarily due to reduced customer demand and destocking of lab consumables",
     quote_value: 10, source_file: data/raw/peers/us_avantor_2023_annual-report.pdf, page: 51}
