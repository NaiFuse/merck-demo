# Thermo Fisher – 6-step restatement to DS-comparable EMEA Academia revenue (see CLAUDE.md "Peer restatement").
# Facts are referenced by (period, region, segment) as stored by src/connectors/edgar.py; numbers in USD_m.
# Shares/weights: low / base / high. Grade A = disclosed, B = triangulated, C = estimate (always a range).
# evidence: verbatim sentence checked against the cached 10-K text (src/models/peer_restatement.py).

peer: thermo_fisher
label: Thermo Fisher
period: FY2025
currency: USD
tenk_url: https://www.sec.gov/Archives/edgar/data/97745/000009774526000018/tmo-20251231.htm

# Step 1 – total revenue (A)
revenue: {period: FY2025}

# Step 2 – Europe share = Europe geographic revenue / total (A), times a mix factor for the in-scope businesses
geo:
  numerator: {period: FY2025, region: Europe}
  denominator: {period: FY2025}
  mix_factor:
    {key: geo_mix_factor, low: 0.9, base: 1.0, high: 1.1, grade: C,
     source: "estimate: in-scope lab businesses assumed to have the company's Europe mix +-10%",
     note: "TMO 'Europe' excludes Middle East/Africa (in 'Other regions'); treated as EMEA proxy."}

# Step 3 – business scope: in-scope sub-segment revenue (A) x weight, less intra-group double counting
scope:
  include:
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=LifeSciencesSolutions;subsegment=Biosciences"}
      weight: {key: w_biosciences, low: 1, base: 1, high: 1, grade: A, source: "in scope: reagents, cell culture, antibodies, plastics"}
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=LaboratoryProductsAndBiopharmaServices;subsegment=LaboratoryProducts"}
      weight: {key: w_laboratory_products, low: 1, base: 1, high: 1, grade: A, source: "in scope: lab consumables, equipment, chemicals"}
      evidence: "Our laboratory products include lab consumables, equipment and chemicals"
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=LaboratoryProductsAndBiopharmaServices;subsegment=ResearchAndSafetyMarketChannel"}
      weight: {key: w_research_safety_channel, low: 1, base: 1, high: 1, grade: A, source: "in scope: Fisher distribution channel"}
      evidence: "Our research and safety market channel offers a mix of products that are manufactured by Thermo Fisher, by third parties for us on a private-label basis, and by third parties under their brands"
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=LifeSciencesSolutions;subsegment=GeneticSciences"}
      weight: {key: w_genetic_sciences, low: 0.1, base: 0.2, high: 0.3, grade: C,
               source: "estimate: PCR/qPCR reagents and consumables part; sequencing/PCR instruments excluded"}
    - ref: {period: FY2025, segment: "consolidation=OperatingSegments;segment=AnalyticalInstruments;subsegment=ChromatographyAndMassSpectrometry"}
      weight: {key: w_chromatography_ms, low: 0.05, base: 0.1, high: 0.15, grade: C,
               source: "estimate: columns, standards and chromatography consumables; instruments excluded"}
    # Excluded (weight 0 by CLAUDE.md taxonomy): BioProduction (bioprocess), Pharma Services, Clinical Research
    # (services), Specialty Diagnostics (diagnostics), Electron Microscopy and Chemical Analysis (instruments).
  deduct:
    - ref: {period: FY2025, segment: "segment=LaboratoryProductsAndBiopharmaServices;subsegment_consolidation=IntersubsegmentEliminations", abs: true}
      weight: {key: d_lpbs_intersubsegment, low: 1, base: 1, high: 1, grade: A,
               source: "disclosed eliminations: lab products sold through the channel are counted in both sub-segments"}
    - ref: {period: FY2025, segment: "consolidation=MaterialReconcilingItems;segment=LifeSciencesSolutions"}
      weight: {key: d_lss_intersegment_in_scope, low: 0.6, base: 0.75, high: 0.9, grade: C,
               source: "estimate: share of LSS intersegment revenue (sold via the channel) that is Biosciences/Genetic Sciences"}

# Step 4 – DS-equivalent product share of in-scope revenue (excl. equipment, instruments, PPE/safety, services)
ds_share:
  {key: ds_share, low: 0.45, base: 0.55, high: 0.65, grade: C,
   source: "estimate: channel and lab products include equipment, safety/PPE and services outside the DS categories"}

# Step 4b – share of DS-equivalent revenue that is resold Merck/Sigma-Aldrich product (shown as 'of which resold Merck')
merck_resale_share:
  {key: merck_resale_share, low: 0.04, base: 0.07, high: 0.10, grade: C,
   source: "estimate: third-party brands in the research and safety channel include Merck/Sigma-Aldrich"}

# Step 5 – Academia share (Merck counts hospitals as Academia) =
#   disclosed A&G share x concentration in the in-scope lab businesses x EMEA factor + hospital add-on
academia:
  eg_share:
    {key: ag_share_company, low: 0.14, base: 0.14, high: 0.14, grade: A, unit: share,
     source: "Thermo Fisher 2025 Annual Report, Revenue Profile (markets), FY2025 company level",
     quote: "Academic & Government 14%", quote_value: 14,
     source_file: data/raw/peers/us_thermo-fisher_2025_annual-report.pdf, page: 5,
     note: "Chart text layer lists labels and numbers out of order; A&G is 14% or 15% under either reading (2024: 14-15%)."}
  concentration:
    {key: ag_concentration_in_scope, low: 1.3, base: 1.6, high: 1.9, grade: C,
     source: "estimate: A&G buys research consumables and channel products more than pharma services/CRO (PPD, pharma services, bioproduction excluded in step 3). Hard cap: all A&G revenue in scope = 6.2bn / 12.8bn = 49%"}
  emea_factor:
    {key: ag_emea_factor, low: 0.9, base: 1.0, high: 1.15, grade: C,
     source: "estimate: Europe vs. company A&G mix; Fisher Scientific GmbH reports Academic among its two largest segments, +16.8% in FY2025 while TMO's global A&G market declined"}
  hospital_addon:
    {key: hospital_addon, low: 0.02, base: 0.04, high: 0.06, grade: C, unit: share points,
     source: "estimate: hospital research/clinical labs buying in-scope (non-diagnostics) lab products; Diagnostics & Healthcare (14-15%) is mostly Specialty Diagnostics, excluded in step 3"}
