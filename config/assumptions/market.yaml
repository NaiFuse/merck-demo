# Shared drivers for the peer restatement (step 6).

# Share of a peer's Europe revenue in each demo cluster (low / base / high). Grade C placeholders from approximate
# GERD (R&D spend) weights across Europe; replace with Eurostat rd_e_gerdtot when the eurostat connector lands
# (milestone 4). The remainder (~22%) is Southern/Eastern Europe, outside the demo clusters.
clusters:
  dach:
    {key: cluster_share_dach, low: 0.28, base: 0.35, high: 0.42, grade: C,
     source: "placeholder: approx. GERD weight DE+AT+CH in Europe; to be replaced by Eurostat"}
  france_benelux:
    {key: cluster_share_france_benelux, low: 0.17, base: 0.21, high: 0.25, grade: C,
     source: "placeholder: approx. GERD weight FR+BE+NL+LU in Europe; to be replaced by Eurostat"}
  uk_ireland_nordics:
    {key: cluster_share_uk_ireland_nordics, low: 0.18, base: 0.22, high: 0.27, grade: C,
     source: "placeholder: approx. GERD weight GB+IE+SE+NO+DK+FI+IS in Europe; to be replaced by Eurostat"}

# USD -> EUR: average of the 12 ECB monthly reference rates of the fiscal year (grade A, src/connectors/ecb_fx.py)
fx:
  currency: USD

# Monte Carlo over all restatement inputs (triangular low / mode=base / high, independent draws)
monte_carlo:
  draws: 10000
  seed: 20261118
  display: [p10, p90]

# DACH sanity anchors (step 8): the peers' German channel companies (Unternehmensregister filings, FY2025).
# Anchor = register revenue in DS-type categories x Germany share x academia share, compared with the estimate's
# Germany-equivalent (DACH estimate x Germany share of DACH).
dach_anchor:
  germany_share_of_dach:
    {key: germany_share_of_dach, low: 0.72, base: 0.77, high: 0.82, grade: C,
     source: "placeholder: approx. GERD weight DE / (DE+AT+CH); replace with Eurostat"}
  fisher_academic_share:
    {key: fisher_gmbh_academic_share, low: 0.25, base: 0.32, high: 0.40, grade: C,
     source: "estimate: Fisher Scientific GmbH names Academic one of its two largest segments (FY2025, +16.8%)"}
  vwr_lab_consumables_share:
    {key: vwr_gmbh_consumables_in_labtech, low: 0.45, base: 0.55, high: 0.65, grade: C,
     source: "estimate: consumables share of 'Labortechnik und Sonstiges' (lab equipment + consumables + other)"}
  vwr_academic_share:
    {key: vwr_gmbh_academic_share, low: 0.12, base: 0.17, high: 0.22, grade: C,
     source: "Avantor Europe E&G 10% + part of Healthcare 10% (FY2023, disclosed), concentrated in the lab channel"}
